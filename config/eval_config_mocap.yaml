# 动捕评估器配置文件

# 真值数据源
ground_truth_source: "mocap"  # "gazebo" 或 "mocap"
ground_truth_topic: "/vrpn_client_node"  # 动捕真值话题基础路径（自动发现子话题）

# 动捕模式配置
mocap_mode: true  # 启用动捕模式：使用3D欧氏距离进行关联，不使用IOU

# 动捕ID到Z轴高度的映射
# 根据实际动捕环境中物体的高度设置
# 键：物体类别名称，值：中心点Z轴高度（米）
mocap_id_height_map:
  car: 0.5        # 车辆中心高度
  person: 0.9     # 人体中心高度
  uav: 1.5      # 无人机中心高度

# 动捕物体类别列表（用于提供默认类别映射，实际类别从话题名称提取）
mocap_object_classes: ['car', 'person', 'uav']

# 数据关联参数
distance_threshold: 1.0      # XY平面距离阈值(米)
iou_threshold: 0.1           # IOU阈值（动捕模式不使用此参数）
                             
# 更新频率
update_freq: 10.0            # 评估更新频率(Hz)

# 可视化模式
visualization_mode: "immediate"  # immediate: 接收到数据立即可视化（推荐）
                                 # timer: 在定时器中可视化

# 时间戳模式
timestamp_mode: "original"       # original: 使用消息原始时间戳（推荐）
                                 # now: 使用实时时间戳

# 调试选项
debug_timestamps: true

# 评估控制参数
max_frames: 300              # 最大评估帧数，0表示无限制

# 输出目录
output_dir: "results/algorithm_eval"

# 算法话题配置
mdetector_topic: "/m_detector/frame_out"
fapp_topic: "/states"
lvdot_topic: "/onboard_detector/dynamic_bboxes"
ldot_topic: "/ldot_detector/dynamic_bboxes"

# 动捕模式下不需要dynamic_keywords（Gazebo专用）

# 默认边界框尺寸[长, 宽, 高] (米)
# 根据物体类别在detection_adapter中设置
default_bbox_size: [0.5, 0.5, 1.8]

# 评估系统 DBSCAN 聚类参数
mdetector_dbscan_eps: 0.5
mdetector_dbscan_min_samples: 10
