# 评估器配置文件

# 数据关联参数
distance_threshold: 1      # 最大匹配距离(米) - 只使用距离判断

# 更新频率
update_freq: 10.0            # 评估更新频率(Hz)

# 评估控制参数（用于多次实验对比）
max_frames: 300              # 最大评估帧数，0表示无限制
                             # 每次实验使用相同帧数，确保对比公平

# 输出目录
output_dir: "results"        # 相对于evaluation包的路径
                             # 每次运行会自动创建带时间戳的子文件夹，如：results/eval_20231216_143025/

# 话题配置
ground_truth_topic: "/gazebo/model_states"
mdetector_topic: "/m_detector/frame_out"          # M-detector动态点云
fapp_topic: "/dynamic_points"                     # FAPP动态点云
lvdot_topic: "/onboard_detector/dynamic_point_cloud"  # LV-DOT动态点云
ldot_topic: "/ldot_detector/dynamic_point_cloud"              # ldot动态点云

# Gazebo动态物体过滤关键词"actor", "dynamic", "obstacle", "sphere", "box"
dynamic_keywords: ["person"]

# 默认边界框尺寸[长, 宽, 高] (米)
default_bbox_size: [0.5, 0.5, 1.8]

# 评估系统 DBSCAN 聚类参数（用于所有点云格式的算法）
# 注意：M-detector 使用体素聚类(0.25m)，输出点云已经过聚类，点云较稀疏
# 其他算法(LDOT/LV-DOT/FAPP)使用 DBSCAN，参数为 eps=0.2-0.4m, min_points=3-10
# 评估系统需要统一重新聚类，参数需要兼容不同算法的输出特性

mdetector_dbscan_eps: 0.5    # 聚类半径（米）
mdetector_dbscan_min_samples: 10  # 最小点数

# 质心补偿配置
# 由于激光雷达只能看到物体的一面，点云质心会偏向传感器方向
# 需要根据传感器位置进行补偿，估算物体的真实几何中心
enable_centroid_compensation: true  # true=启用补偿, false=直接使用质心

# 里程计话题（用于获取机器人位置）
odom_topic: "/Odometry"

# 激光雷达外参：激光雷达相对于机体坐标系的位置和姿态
# [x, y, z, roll, pitch, yaw]
# x, y, z: 激光雷达相对于机体中心的平移（米）
# roll, pitch, yaw: 激光雷达相对于机体的旋转（弧度）
lidar_extrinsics: [-0.005, 0.0, 0.06, 0.0, 0.0, 0.0]
                          
